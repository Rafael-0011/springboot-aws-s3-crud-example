# ============================================
# Application Configuration
# ============================================
spring.application.name=testS3

# ============================================
# PostgreSQL Configuration
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tests3}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:2002}
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}

# ============================================
# Flyway Configuration
# ============================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baselineOnMigrate=${FLYWAY_BASELINE:true}
spring.flyway.validateOnMigrate=${FLYWAY_VALIDATE:true}

# ============================================
# AWS S3 Configuration
# ============================================
# Spring Cloud AWS - Configuração da região
spring.cloud.aws.region.static=sa-east-1

# Configurações customizadas para a aplicação
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:spring401}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.example.testS3=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/application.log
logging.level.org.springframework.boot.autoconfigure=WARN

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.servlet.context-path=/

# ============================================
# Multipart Configuration
# ============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ============================================
# OpenAPI/Swagger Configuration
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
